server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name radio.girthplex.info;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name radio.girthplex.info;

    ssl_certificate /etc/ssl/magic-fm/domain.cert.pem;
    ssl_certificate_key /etc/ssl/magic-fm/private.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Loopback-only gate for admin - MUST come before the general location.
    # See ADMIN-ACCESS.md. nginx is the only proxy in this stack, so these
    # headers are overwritten (not appended to) here - nothing the client
    # sends in X-Forwarded-For/X-Real-IP survives to reach the app, which is
    # what makes it safe for middleware.get_client_ip() to trust them.
    location ~ ^/(admin\.html|api/admin/) {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/magic-fm/static/;
        expires 1h;
        access_log off;
    }

    location /uploads/ {
        alias /var/www/magic-fm/uploads/;
        expires 1h;
        access_log off;
    }

    # Loopback-only - exposes live viewer/bitrate stats from the rtmp module.
    # stream.py polls this over 127.0.0.1; never reachable publicly.
    location /rtmp-stat {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        rtmp_stat all;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
