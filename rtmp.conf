rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # DJs publish with their existing stream key as the RTMP stream
            # name (same key already shown on the dashboard) - these callbacks
            # validate it and track who's on air. Both are loopback calls from
            # nginx itself straight to uvicorn, same trust boundary as
            # everything else proxied to 127.0.0.1:8000.
            on_publish http://127.0.0.1:8000/api/stream/auth;
            on_publish_done http://127.0.0.1:8000/api/stream/publish-done;

            # Native DASH packaging - no ffmpeg transcode needed for a single
            # passthrough quality. Whatever codecs OBS/Streamlabs send (H.264
            # + AAC by default) get fragmented straight into MP4 segments.
            dash on;
            dash_path /var/www/magic-fm/dash;
            dash_fragment 3;
            dash_playlist_length 20;
            dash_cleanup on;
        }
    }
}
